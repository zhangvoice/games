   <script>
        $(document).ready(function () {
            const $btn = $('#mobile-menu-btn');
            const $closeBtn = $('#close-menu-btn');
            const $drawer = $('#mobile-menu-drawer');
            const $overlay = $('#mobile-menu-overlay');

            function openMenu() {
                $overlay.removeClass('hidden');
                // Force reflow
                $overlay[0].offsetHeight;
                $overlay.removeClass('opacity-0');
                $drawer.removeClass('translate-x-full');
                $('body').addClass('overflow-hidden');
            }

            function closeMenu() {
                $overlay.addClass('opacity-0');
                $drawer.addClass('translate-x-full');
                setTimeout(() => {
                    $overlay.addClass('hidden');
                    $('body').removeClass('overflow-hidden');
                }, 300);
            }

            $btn.on('click', openMenu);
            $closeBtn.on('click', closeMenu);
            $overlay.on('click', closeMenu);
        });
    </script>
